{% extends 'base.html' %}
{% load static %}

{% block title %}{% if edit_mode %}Edit{% else %}Add{% endif %} Contact - Contact Manager{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-container">
        <h2>{% if edit_mode %}Edit Contact{% else %}Add New Contact{% endif %}</h2>
        
        <form id="contactForm" class="contact-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Full name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email address" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="Phone number" required>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Street address (optional)">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">{% if edit_mode %}Update Contact{% else %}Create Contact{% endif %}</button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='{% url 'contacts_list' %}'">Cancel</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const params = new URLSearchParams(window.location.search);
    const contactId = params.get('id');
    const isEditMode = !!contactId;

    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('access_token');
        if (!token) {
            window.location.href = "{% url 'login' %}";
            return;
        }

        if (isEditMode) {
            // Load existing contact
            try {
                const response = await fetch(`http://127.0.0.1:8000/api/contacts/${contactId}/`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const contact = await response.json();
                
                document.getElementById('name').value = contact.name;
                document.getElementById('email').value = contact.email;
                document.getElementById('phone').value = contact.phone;
                document.getElementById('address').value = contact.address || '';
            } catch (error) {
                alert('Error loading contact');
            }
        }
    });

    document.getElementById('contactForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const token = localStorage.getItem('access_token');
        const contactData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value
        };

        try {
            const url = isEditMode 
                ? `http://127.0.0.1:8000/api/contacts/${contactId}/`
                : 'http://127.0.0.1:8000/api/contacts/';
            
            const method = isEditMode ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(contactData)
            });

            if (response.ok) {
                alert(isEditMode ? 'Contact updated successfully' : 'Contact created successfully');
                window.location.href = "{% url 'contacts_list' %}";
            } else {
                const error = await response.json();
                alert('Error: ' + JSON.stringify(error));
            }
        } catch (error) {
            alert('Error saving contact: ' + error.message);
        }
    });
</script>
{% endblock %}
