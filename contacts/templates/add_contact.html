{% extends 'base.html' %}
{% load static %}

{% block title %}{% if edit_mode %}Edit{% else %}Add{% endif %} Contact - Contact Manager{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-container">
        <h2>{% if edit_mode %}Edit Contact{% else %}Add New Contact{% endif %}</h2>
        
        <form id="contactForm" class="contact-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Full name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email address" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="Phone number" required>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Street address (optional)">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="friend">Friend</option>
                        <option value="family">Family</option>
                        <option value="work">Work</option>
                        <option value="emergency">Emergency</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="is_online">
                    <input type="checkbox" id="is_online" name="is_online">
                    Online Status
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">{% if edit_mode %}Update Contact{% else %}Create Contact{% endif %}</button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='{% url 'contacts_list' %}'">Cancel</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const params = new URLSearchParams(window.location.search);
    const contactId = params.get('id');
    const isEditMode = !!contactId;

    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('access_token');
        if (!token) {
            window.location.href = "{% url 'login' %}";
            return;
        }

        if (isEditMode) {
            try {
                const response = await fetch(`/api/contacts/${contactId}/`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) {
                    showError('Failed to load contact');
                    return;
                }
                const contact = await response.json();
                
                document.getElementById('name').value = contact.name;
                document.getElementById('email').value = contact.email;
                document.getElementById('phone').value = contact.phone;
                document.getElementById('address').value = contact.address || '';
                document.getElementById('category').value = contact.category || 'other';
                document.getElementById('status').value = contact.status || 'active';
                document.getElementById('is_online').checked = contact.is_online || false;
            } catch (error) {
                showError('Error loading contact: ' + error.message);
            }
        }
    });

    document.getElementById('contactForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const token = localStorage.getItem('access_token');
        const contactData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            category: document.getElementById('category').value,
            status: document.getElementById('status').value,
            is_online: document.getElementById('is_online').checked
        };

        try {
            const url = isEditMode 
                ? `/api/contacts/${contactId}/`
                : '/api/contacts/';
            
            const method = isEditMode ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(contactData)
            });

            if (response.ok) {
                showSuccess(isEditMode ? 'Contact updated successfully' : 'Contact created successfully');
                setTimeout(() => {
                    window.location.href = "{% url 'contacts_list' %}";
                }, 300);
            } else {
                const error = await handleApiError(response);
                showError(error || (isEditMode ? 'Error updating contact' : 'Error creating contact'));
            }
        } catch (error) {
            showError((isEditMode ? 'Error updating contact: ' : 'Error saving contact: ') + error.message);
        }
    });
</script>
{% endblock %}
