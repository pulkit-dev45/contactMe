{% extends 'base.html' %}
{% load static %}

{% block title %}My Contacts - Contact Manager{% endblock %}

{% block content %}
<div class="contacts-page">
    <div class="page-header">
        <h2>My Contacts</h2>
        <button class="btn btn-primary" onclick="window.location.href='{% url 'add_contact' %}'">+ Add New Contact</button>
    </div>

    <div class="search-filter">
        <input type="text" id="searchInput" placeholder="Search by name, email, phone..." class="search-box">
        <select id="categoryFilter" class="category-filter">
            <option value="">All Categories</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="family">Family</option>
        </select>
        <button class="btn btn-secondary" id="filterBtn">Filter</button>
    </div>

    <div id="contactsList" class="contacts-grid">
        <!-- Contacts will be loaded here -->
    </div>

    <div id="loadingSpinner" class="spinner" style="display:none;">
        <p>Loading contacts...</p>
    </div>
</div>

<!-- Contact Detail Modal -->
<div id="contactModal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="close-btn" onclick="closeContactModal()">&times;</span>
        <div id="contactDetail" class="contact-detail">
            <!-- Contact details will be loaded here -->
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/contacts.js' %}"></script>
<script>
    // Load contacts on page load
    document.addEventListener('DOMContentLoaded', loadContacts);

    async function loadContacts() {
        const token = localStorage.getItem('access_token');
        if (!token) {
            window.location.href = "{% url 'login' %}";
            return;
        }

        try {
            document.getElementById('loadingSpinner').style.display = 'block';
            const response = await fetch('http://127.0.0.1:8000/api/contacts/', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                const contacts = await response.json();
                displayContacts(contacts);
            } else if (response.status === 401) {
                window.location.href = "{% url 'login' %}";
            }
        } catch (error) {
            console.error('Error loading contacts:', error);
            document.getElementById('contactsList').innerHTML = '<p>Error loading contacts</p>';
        } finally {
            document.getElementById('loadingSpinner').style.display = 'none';
        }
    }

    function displayContacts(contacts) {
        const contactsList = document.getElementById('contactsList');
        
        if (contacts.length === 0) {
            contactsList.innerHTML = '<p class="no-contacts">No contacts found. <a href="{% url 'add_contact' %}">Add one now!</a></p>';
            return;
        }

        contactsList.innerHTML = contacts.map(contact => `
            <div class="contact-card">
                <div class="contact-header">
                    <h3>${contact.name}</h3>
                    <button class="menu-btn" onclick="openContactModal(${contact.id})">⋮</button>
                </div>
                <div class="contact-info">
                    <p><strong>Email:</strong> ${contact.email}</p>
                    <p><strong>Phone:</strong> ${contact.phone}</p>
                    ${contact.address ? `<p><strong>Address:</strong> ${contact.address}</p>` : ''}
                </div>
                <div class="contact-actions">
                    <button class="btn btn-small btn-edit" onclick="editContact(${contact.id})">Edit</button>
                    <button class="btn btn-small btn-danger" onclick="deleteContact(${contact.id})">Delete</button>
                </div>
            </div>
        `).join('');
    }

    async function openContactModal(contactId) {
        const token = localStorage.getItem('access_token');
        try {
            const response = await fetch(`http://127.0.0.1:8000/api/contacts/${contactId}/`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const contact = await response.json();
            
            const modal = document.getElementById('contactModal');
            modal.style.display = 'block';
            
            document.getElementById('contactDetail').innerHTML = `
                <div class="detail-header">
                    <h2>${contact.name}</h2>
                    <span class="online-status">● Online</span>
                </div>
                <div class="detail-info">
                    <p><strong>Email:</strong> ${contact.email}</p>
                    <p><strong>Phone:</strong> ${contact.phone}</p>
                    ${contact.address ? `<p><strong>Address:</strong> ${contact.address}</p>` : ''}
                    <p><strong>Created:</strong> ${new Date(contact.created_at).toLocaleDateString()}</p>
                </div>
                <div class="detail-actions">
                    <button class="btn btn-primary" onclick="editContact(${contact.id})">Edit Contact</button>
                    <button class="btn btn-danger" onclick="deleteContact(${contact.id})">Delete Contact</button>
                </div>
            `;
        } catch (error) {
            alert('Error loading contact details');
        }
    }

    function closeContactModal() {
        document.getElementById('contactModal').style.display = 'none';
    }

    function editContact(contactId) {
        window.location.href = `{% url 'edit_contact' %}?id=${contactId}`;
    }

    async function deleteContact(contactId) {
        if (!confirm('Are you sure you want to delete this contact?')) return;

        const token = localStorage.getItem('access_token');
        try {
            const response = await fetch(`http://127.0.0.1:8000/api/contacts/${contactId}/`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.ok) {
                alert('Contact deleted successfully');
                loadContacts();
                closeContactModal();
            }
        } catch (error) {
            alert('Error deleting contact');
        }
    }

    // Search functionality
    document.getElementById('searchInput').addEventListener('input', async (e) => {
        const searchTerm = e.target.value.toLowerCase();
        const token = localStorage.getItem('access_token');
        
        try {
            const response = await fetch('http://127.0.0.1:8000/api/contacts/', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const contacts = await response.json();
            
            const filtered = contacts.filter(contact => 
                contact.name.toLowerCase().includes(searchTerm) ||
                contact.email.toLowerCase().includes(searchTerm) ||
                contact.phone.includes(searchTerm)
            );
            
            displayContacts(filtered);
        } catch (error) {
            console.error('Search error:', error);
        }
    });
</script>
{% endblock %}
